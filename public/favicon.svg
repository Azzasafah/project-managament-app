<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base with Cyber Tech Border -->
  <rect width="114" height="114" x="7" y="7" rx="30" fill="url(#bgDark)" stroke="#ffffff" stroke-width="5" stroke-opacity="0.2" filter="url(#glow)" />

  <!-- Diagonal Corner Notch Accent -->
  <path d="M96 16 L112 32" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6" />
  
  <!-- Center Bold Typography S matching Portfolio Logo -->
  <text x="64" y="89" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="82" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle"
        letter-spacing="-2">S</text>
        
  <!-- Subtle Glowing Corner Node -->
  <circle cx="98" cy="98" r="4.5" fill="#ffffff" opacity="0.9" />
</svg>
